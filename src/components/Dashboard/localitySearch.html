<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0 auto;
            padding: 20px;
            max-width: 1200px;
            background-color: #f9f9f9;
        }
        h1, h2, h3 {
            color: #333;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .search-container {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .search-tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }
        .search-tab {
            padding: 8px 15px;
            cursor: pointer;
            background: #f1f1f1;
            border: 1px solid #ddd;
            border-bottom: none;
            border-radius: 3px 3px 0 0;
            margin-right: 5px;
        }
        .search-tab.active {
            background: white;
            border-bottom: 1px solid white;
            margin-bottom: -1px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            box-sizing: border-box;
        }
        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .form-col {
            flex: 1;
            min-width: 200px;
        }
        button {
            background-color: #4285f4;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #3367d6;
        }
        .results-wrapper {
            display: flex;
            gap: 20px;
        }
        #filters-container {
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex: 0 0 250px;
            align-self: flex-start;
        }
        .filter-title {
            font-weight: bold;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }
        .filter-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            cursor: pointer;
        }
        .filter-item:hover {
            background-color: #f5f5f5;
        }
        .filter-count {
            background-color: #e0e0e0;
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 12px;
        }
        #results-container {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex: 1;
        }
        .result-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            margin-bottom: 10px;
        }
        .result-title {
            font-size: 18px;
            color: #1a73e8;
            margin-bottom: 5px;
        }
        .result-meta {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        .highlight {
            background-color: #ffeb3b;
            padding: 0 2px;
        }
        #pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .page-btn {
            margin: 0 5px;
            padding: 5px 10px;
            border: 1px solid #ddd;
            background-color: white;
            cursor: pointer;
            border-radius: 3px;
        }
        .page-btn.active {
            background-color: #4285f4;
            color: white;
            border-color: #4285f4;
        }
        #loading {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
<h1></h1>

<div class="search-container">
    <div class="search-tabs">
        <div class="search-tab active" data-form="simple-search">Simple Search</div>
        <div class="search-tab" data-form="advanced-search">Advanced Search</div>
    </div>

    <!-- Simple Search Form -->
    <form id="simple-search" class="search-form">
        <div class="form-group">
            <label for="query">Keyword Search</label>
            <input type="text" id="query" name="query" >
        </div>
        <button type="submit">Search</button>
    </form>

    <!-- Advanced Search Form -->
    <form id="advanced-search" class="search-form" style="display: none;">
        <div class="form-row">
            <div class="form-col">
                <div class="form-group">
                    <label for="locality_string">Location Description</label>
                    <input type="text" id="locality_string" name="locality_string">
                </div>
                <div class="form-group">
                    <label for="field_no">Field No#</label>
                    <input type="text" id="field_no" name="field_no" >
                </div>
                <div class="form-group">
                    <label for="drainage">Drainage</label>
                    <input type="text" id="drainage" name="drainage" >
                </div>
                <div class="form-group">
                    <label for="waterbody">Waterbody</label>
                    <input type="text" id="waterbody" name="waterbody" >
                </div>
            </div>

            <div class="form-col">
                <div class="form-group">
                    <label for="country">Country</label>
                    <input type="text" id="country" name="country" >
                </div>
                <div class="form-group">
                    <label for="state">State/Province</label>
                    <input type="text" id="state" name="state">
                </div>
                <div class="form-group">
                    <label for="county">County</label>
                    <input type="text" id="county" name="county">
                </div>
                <div class="form-group">
                    <label for="continent">Continent</label>
                    <input type="text" id="continent" name="continent">
                </div>
            </div>

            <div class="form-col">
                <div class="form-group">
                    <label for="island">Island</label>
                    <input type="text" id="island" name="island">
                </div>
                <div class="form-group">
                    <label for="island_group">Island Group</label>
                    <input type="text" id="island_group" name="island_group" >
                </div>
                <div class="form-group">
                    <label for="start_date">Date</label>
                    <input type="text" id="start_date" name="start_date" >
                </div>
                <div class="form-group">
                    <label for="verbatim_collectors">Collectors</label>
                    <input type="text" id="verbatim_collectors" name="verbatim_collectors">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="fuzzy">
                <input type="checkbox" id="fuzzy" name="fuzzy" checked>
                Enable Fuzzy Matching
            </label>
        </div>

        <button type="submit">Advanced Search</button>
    </form>
</div>

<div id="loading" style="display: none;">
    <p>Searching...</p>
</div>

<div class="results-wrapper">
    <div id="filters-container" style="display: none;">
        <h3>Filter Results</h3>

        <div id="country-filters">
            <div class="filter-title">Country</div>
            <div id="country-list"></div>
        </div>

        <div id="state-filters">
            <div class="filter-title">State/Province</div>
            <div id="state-list"></div>
        </div>

        <div id="drainage-filters">
            <div class="filter-title">Drainage</div>
            <div id="drainage-list"></div>
        </div>
    </div>

    <div id="results-container">
        <h2>Search Results</h2>
        <div id="results-count"></div>
        <div id="results-list"></div>
        <div id="pagination"></div>
    </div>
</div>

<script>
    // Basic Configuration
    const ES_HOST = 'http://localhost:9200'; // Elasticsearch address
    const ES_INDEX = 'geo_gazetteer'; // Index name
    let currentPage = 1;
    const resultsPerPage = 10;
    let totalResults = 0;
    let currentResults = [];
    let currentFilters = {};
    let lastSearchParams = {};

    // DOM Elements
    const simpleSearchForm = document.getElementById('simple-search');
    const advancedSearchForm = document.getElementById('advanced-search');
    const searchTabs = document.querySelectorAll('.search-tab');
    const loadingElement = document.getElementById('loading');
    const resultsContainer = document.getElementById('results-container');
    const resultsCountElement = document.getElementById('results-count');
    const resultsListElement = document.getElementById('results-list');
    const paginationElement = document.getElementById('pagination');
    const filtersContainer = document.getElementById('filters-container');

    // Switch search form tabs
    searchTabs.forEach(tab => {
        tab.addEventListener('click', function() {
            const formId = this.getAttribute('data-form');

            // Remove all active states
            searchTabs.forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.search-form').forEach(form => form.style.display = 'none');

            // Add active state to current tab and form
            this.classList.add('active');
            document.getElementById(formId).style.display = 'block';
        });
    });

    // Simple search form submission
    simpleSearchForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const query = document.getElementById('query').value.trim();
        if (query) {
            performSearch({ query: query, fuzzy: true });
        }
    });

    // Advanced search form submission
    advancedSearchForm.addEventListener('submit', function(e) {
        e.preventDefault();

        // Collect all field values
        const searchParams = {
            locality_string: document.getElementById('locality_string').value.trim(),
            field_no: document.getElementById('field_no').value.trim(),
            drainage: document.getElementById('drainage').value.trim(),
            waterbody: document.getElementById('waterbody').value.trim(),
            country: document.getElementById('country').value.trim(),
            state: document.getElementById('state').value.trim(),
            county: document.getElementById('county').value.trim(),
            continent: document.getElementById('continent').value.trim(),
            island: document.getElementById('island').value.trim(),
            island_group: document.getElementById('island_group').value.trim(),
            start_date: document.getElementById('start_date').value.trim(),
            verbatim_collectors: document.getElementById('verbatim_collectors').value.trim(),
            fuzzy: document.getElementById('fuzzy').checked
        };

        // Filter out empty values
        const filteredParams = Object.fromEntries(
            Object.entries(searchParams).filter(([_, value]) =>
                value !== '' && value !== false && value !== null && value !== undefined
            )
        );

        if (Object.keys(filteredParams).length > 0) {
            performSearch(filteredParams);
        }
    });

    function buildElasticsearchQuery(params) {
        const fuzzyEnabled = params.fuzzy !== false;  // 默认为 true
        let query = {
            bool: {
                should: [],
                filter: []
            }
        };

        // === Simple Search ===
        if (params.query) {
            const queryString = params.query;

            query.bool.should = [
                // 精确匹配 field_no
                {
                    term: {
                        "field_no.keyword": {
                            value: queryString,
                            boost: 10
                        }
                    }
                },
                // 精确短语匹配 locality_string.raw
                {
                    match_phrase: {
                        "locality_string.raw": {
                            query: queryString,
                            boost: 5
                        }
                    }
                },
                // 多字段模糊匹配
                {
                    multi_match: {
                        query: queryString,
                        fields: [
                            "full_text^2",
                            "name^3",
                            "locality_string^3",
                            "drainage",
                            "country",
                            "state",
                            "county",
                            "continent",
                            "island",
                            "island_group",
                            "waterbody",
                            "verbatim_collectors"
                        ],
                        fuzziness: fuzzyEnabled ? "AUTO" : "0",
                        boost: 1
                    }
                }
            ];

            query.bool.minimum_should_match = 1;

        } else {
            // === Advanced Search ===
            for (const [field, value] of Object.entries(params)) {
                if (field === 'fuzzy' || !value) continue;

                // field_no 和 start_date 用精确匹配
                if (field === 'field_no' || field === 'start_date') {
                    query.bool.should.push({
                        term: {
                            [`${field}.keyword`]: {
                                value: value,
                                boost: 10
                            }
                        }
                    });
                    continue;
                }

                // 先 match_phrase 精确短语匹配
                query.bool.should.push({
                    match_phrase: {
                        [field]: {
                            query: value,
                            boost: 3
                        }
                    }
                });

                // 再 fallback 到模糊 match 查询
                query.bool.should.push({
                    match: {
                        [field]: {
                            query: value,
                            fuzziness: fuzzyEnabled ? "AUTO" : "0",
                            boost: 1
                        }
                    }
                });
            }

            if (query.bool.should.length === 0) {
                query.bool.should.push({ match_all: {} });
            }

            query.bool.minimum_should_match = 1;
        }

        // === Filters ===
        for (const [field, value] of Object.entries(currentFilters)) {
            if (value) {
                query.bool.filter.push({
                    term: {
                        [`${field}.keyword`]: value
                    }
                });
            }
        }

        return query;
    }



    // Build aggregation query
    function buildAggregations() {
        return {
            countries: {
                terms: {
                    field: "country.keyword",
                    size: 50
                }
            },
            states: {
                terms: {
                    field: "state.keyword",
                    size: 50
                }
            },
            drainages: {
                terms: {
                    field: "drainage.keyword",
                    size: 50
                }
            }
        };
    }

    // Directly call Elasticsearch to perform search
    async function performSearch(params, page = 1) {
        try {
            // Save search parameters for pagination
            lastSearchParams = { ...params };

            // Update current page
            currentPage = page;

            // Show loading state
            loadingElement.style.display = 'block';
            resultsContainer.style.display = 'none';
            filtersContainer.style.display = 'none';

            // Build Elasticsearch query
            const esQuery = {
                query: buildElasticsearchQuery(params),
                size: resultsPerPage,
                from: (currentPage - 1) * resultsPerPage,
                highlight: {
                    fields: {
                        "full_text": {},
                        "locality_string": {},
                        "drainage": {},
                        "country": {},
                        "state": {},
                        "county": {},
                        "continent": {},
                        "island": {},
                        "island_group": {},
                        "waterbody": {},
                        "verbatim_collectors": {}
                    },
                    pre_tags: ["<span class='highlight'>"],
                    post_tags: ["</span>"]
                },
                aggs: buildAggregations()
            };

            // Send request directly to Elasticsearch
            const response = await fetch(`${ES_HOST}/${ES_INDEX}/_search`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(esQuery)
            });

            if (!response.ok) {
                throw new Error(`Elasticsearch error: ${response.status}`);
            }

            const data = await response.json();

            // Process search results
            processSearchResults(data);

        } catch (error) {
            console.error('Search error:', error);
            loadingElement.style.display = 'none';
            resultsContainer.style.display = 'block';
            resultsListElement.innerHTML = `<div style="text-align: center; padding: 30px; color: #666;">Error during search: ${error.message}</div>`;
        }
    }

    // Process search results
    function processSearchResults(data) {
        // Extract results from Elasticsearch response
        const hits = data.hits.hits || [];
        totalResults = data.hits.total.value || 0;

        // Convert to frontend format
        currentResults = hits.map(hit => {
            return {
                ...hit._source,
                highlights: hit.highlight || {}
            };
        });

        // Update UI
        updateResultsUI();

        // Process aggregation results
        const aggregations = data.aggregations || {};
        updateFiltersUI(aggregations);

        // Hide loading state, show results
        loadingElement.style.display = 'none';
        resultsContainer.style.display = 'block';
        if (totalResults > 0) {
            filtersContainer.style.display = 'block';
        } else {
            filtersContainer.style.display = 'none';
        }
    }

    // Update results UI
    function updateResultsUI() {
        // Update result count
        resultsCountElement.textContent = `Found ${totalResults} results`;

        // If no results
        if (totalResults === 0) {
            resultsListElement.innerHTML = '<div style="text-align: center; padding: 30px; color: #666;">No matching results found</div>';
            paginationElement.innerHTML = '';
            return;
        }

        // Clear results list
        resultsListElement.innerHTML = '';

        // Add result items
        currentResults.forEach(result => {
            const resultElement = document.createElement('div');
            resultElement.className = 'result-item';

            // Build result HTML
            let resultHTML = `
                <div class="result-title">${result.name || result.locality_string || 'Unnamed Location'}</div>
                <div class="result-meta">
                    ${result.field_no ? `<span>ID: ${result.field_no}</span>` : ''}
                    ${result.start_date ? `${result.field_no ? ' • ' : ''}<span>Date: ${result.start_date}</span>` : ''}
                </div>
                <div class="result-location">
                    ${result.county ? `${result.county}, ` : ''}
                    ${result.state ? `${result.state}, ` : ''}
                    ${result.country ? `${result.country}` : ''}
                    ${result.continent ? ` (${result.continent})` : ''}
                </div>
            `;

            // Add drainage information
            if (result.drainage || result.waterbody) {
                resultHTML += `<div class="result-drainage">
                    ${result.drainage ? `Drainage: ${result.drainage}` : ''}
                    ${result.waterbody ? `${result.drainage ? ' • ' : ''}Waterbody: ${result.waterbody}` : ''}
                </div>`;
            }

            // Add collector information
            if (result.verbatim_collectors) {
                resultHTML += `<div class="result-collectors">Collectors: ${result.verbatim_collectors}</div>`;
            }

            // Add highlight content
            if (result.highlights && Object.keys(result.highlights).length > 0) {
                resultHTML += '<div class="result-highlights"><strong>Matched content:</strong><br>';

                for (const [field, highlights] of Object.entries(result.highlights)) {
                    const fieldName = getFieldDisplayName(field);
                    resultHTML += `<div><em>${fieldName}:</em> ${highlights.join(' ... ')}</div>`;
                }

                resultHTML += '</div>';
            }

            resultElement.innerHTML = resultHTML;
            resultsListElement.appendChild(resultElement);
        });

        // Update pagination
        updatePagination();
    }

    // Update pagination UI
    function updatePagination() {
        const totalPages = Math.ceil(totalResults / resultsPerPage);

        // Clear pagination element
        paginationElement.innerHTML = '';

        // If only one page, don't show pagination
        if (totalPages <= 1) {
            return;
        }

        // Add previous page button
        const prevButton = document.createElement('div');
        prevButton.className = 'page-btn prev';
        prevButton.textContent = 'Previous';
        prevButton.addEventListener('click', () => {
            if (currentPage > 1) {
                performSearch(lastSearchParams, currentPage - 1);
                window.scrollTo(0, resultsContainer.offsetTop);
            }
        });
        paginationElement.appendChild(prevButton);

        // Add page number buttons
        const maxPagesToShow = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxPagesToShow / 2));
        let endPage = Math.min(totalPages, startPage + maxPagesToShow - 1);

        if (endPage - startPage + 1 < maxPagesToShow) {
            startPage = Math.max(1, endPage - maxPagesToShow + 1);
        }

        for (let i = startPage; i <= endPage; i++) {
            const pageButton = document.createElement('div');
            pageButton.className = 'page-btn' + (i === currentPage ? ' active' : '');
            pageButton.textContent = i;
            pageButton.addEventListener('click', () => {
                performSearch(lastSearchParams, i);
                window.scrollTo(0, resultsContainer.offsetTop);
            });
            paginationElement.appendChild(pageButton);
        }

        // Add next page button
        const nextButton = document.createElement('div');
        nextButton.className = 'page-btn next';
        nextButton.textContent = 'Next';
        nextButton.addEventListener('click', () => {
            if (currentPage < totalPages) {
                performSearch(lastSearchParams, currentPage + 1);
                window.scrollTo(0, resultsContainer.offsetTop);
            }
        });
        paginationElement.appendChild(nextButton);
    }

    // Update filters UI
    function updateFiltersUI(aggregations) {
        // Handle country filter
        updateFilterList('country-list', 'country', aggregations.countries?.buckets || []);

        // Handle state/province filter
        updateFilterList('state-list', 'state', aggregations.states?.buckets || []);

        // Handle drainage filter
        updateFilterList('drainage-list', 'drainage', aggregations.drainages?.buckets || []);
    }

    // Update filter list
    function updateFilterList(listId, fieldName, buckets) {
        const listElement = document.getElementById(listId);

        // Clear list
        listElement.innerHTML = '';

        // If no items or not enough items, hide the entire filter group
        if (!buckets || buckets.length <= 1) {
            document.getElementById(`${fieldName}-filters`).style.display = 'none';
            return;
        }

        // Show filter group
        document.getElementById(`${fieldName}-filters`).style.display = 'block';

        // If there's a currently selected filter, add "Clear" option
        if (currentFilters[fieldName]) {
            const clearItem = document.createElement('div');
            clearItem.className = 'filter-item';
            clearItem.innerHTML = `
                <span><strong>Clear Filter</strong></span>
            `;
            clearItem.addEventListener('click', () => {
                delete currentFilters[fieldName];
                performSearch(lastSearchParams);
            });
            listElement.appendChild(clearItem);
        }

        // Add filter items
        buckets.forEach(bucket => {
            // Skip empty values
            if (!bucket.key) return;

            const filterItem = document.createElement('div');
            filterItem.className = 'filter-item';

            // Mark currently selected filter
            if (currentFilters[fieldName] === bucket.key) {
                filterItem.style.fontWeight = 'bold';
                filterItem.style.backgroundColor = '#f0f7ff';
            }

            filterItem.innerHTML = `
                <span>${bucket.key}</span>
                <span class="filter-count">${bucket.doc_count}</span>
            `;

            // Add click event
            filterItem.addEventListener('click', () => {
                if (currentFilters[fieldName] === bucket.key) {
                    // If already selected, deselect
                    delete currentFilters[fieldName];
                } else {
                    // Otherwise, select this filter
                    currentFilters[fieldName] = bucket.key;
                }

                // Perform search with filters
                performSearch(lastSearchParams);
            });

            listElement.appendChild(filterItem);
        });
    }

    // Get field display name
    function getFieldDisplayName(field) {
        const fieldNames = {
            'locality_string': 'Location Description',
            'drainage': 'Drainage',
            'country': 'Country',
            'state': 'State/Province',
            'county': 'County',
            'continent': 'Continent',
            'island': 'Island',
            'island_group': 'Island Group',
            'waterbody': 'Waterbody',
            'full_text': 'Full Text',
            'verbatim_collectors': 'Collectors',
            'name': 'Name',
            'field_no': 'ID Number',
            'start_date': 'Date'
        };

        return fieldNames[field] || field;
    }

    // Display welcome message on initial page load
    document.addEventListener('DOMContentLoaded', function() {
        resultsCountElement.textContent = 'Please use the search form above to find geographic locations';
    });
</script>
</body>
</html>
